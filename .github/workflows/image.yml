name: Build TPU image
on:
  workflow_dispatch:
    inputs:
      vllm_torchtpu_commit:
        description: vllm-torchtpu commit whose dependencies the image carries
        required: true
        default: 8421301cf61f9e9ef2b08881cbd11832710136b1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image name
        id: image
        shell: bash
        env:
          COMMIT: ${{ inputs.vllm_torchtpu_commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vllm-torchtpu-deps" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:9}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VLLM_TORCHTPU_COMMIT=${{ inputs.vllm_torchtpu_commit }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:py312-${{ steps.image.outputs.short }}-r${{ github.run_number }}
            ${{ steps.image.outputs.name }}:latest
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
